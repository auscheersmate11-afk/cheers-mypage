<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>チアーズメイト マイページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* Layout: チアーズPHOTOカードと同じ世界観（白×淡い水色の波・紺の太ゴシック・金のキラキラ）。
   1人用の「スタンプ帳」：上に今週の1つの数字と今日やること、その下にPHOTOカード、貢献ポイント、バッジ。 */
:root{
  --bg:#F4F8FD; --paper:#FFFFFF; --wash:#E2EFFB; --wash2:#CDE3F8;
  --ink:#152549; --ink2:#50617F; --line:#D5E2F1; --empty:#EEF4FB;
  --navy:#1A2F66; --onnavy:#FFFFFF; --sky:#2F86D6; --gold:#F2B705; --onGold:#1A2F66; --mist:#A7BDD8; --hl:#FFE46E;
  --good:#138A5E; --good-bg:#DDF3E9; --near:#A86F00; --near-bg:#FCEFCB; --push:#C9501F; --push-bg:#FBE3D8; --start-bg:#E2EFFB;
  --c-share:#F2B705; --c-photo:#1BAF7A; --c-thread:#7C6CF0; --c-comment:#2F86D6; --c-like:#F06C9B; --c-intro:#A7BDD8;
  --shadow:0 10px 30px rgba(26,47,102,.10);
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-num:"Outfit","Avenir Next","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1530; --paper:#122048; --wash:#152A5A; --wash2:#1A3470;
  --ink:#EAF1FB; --ink2:#A8B8D5; --line:#26407A; --empty:#182A57;
  --navy:#9CC8F4; --onnavy:#0B1530; --sky:#5AA8EF; --gold:#F6C933; --onGold:#0B1530; --mist:#6E86AB; --hl:rgba(246,201,51,.38);
  --good:#4BD39B; --good-bg:#123C33; --near:#F6C933; --near-bg:#3A3215; --push:#FF8A5C; --push-bg:#40231A; --start-bg:#1A3470;
  --c-share:#F6C933; --c-photo:#34C98F; --c-thread:#9D91FF; --c-comment:#5AA8EF; --c-like:#FF8DB5; --c-intro:#6E86AB;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1530; --paper:#122048; --wash:#152A5A; --wash2:#1A3470;
  --ink:#EAF1FB; --ink2:#A8B8D5; --line:#26407A; --empty:#182A57;
  --navy:#9CC8F4; --onnavy:#0B1530; --sky:#5AA8EF; --gold:#F6C933; --onGold:#0B1530; --mist:#6E86AB; --hl:rgba(246,201,51,.38);
  --good:#4BD39B; --good-bg:#123C33; --near:#F6C933; --near-bg:#3A3215; --push:#FF8A5C; --push-bg:#40231A; --start-bg:#1A3470;
  --c-share:#F6C933; --c-photo:#34C98F; --c-thread:#9D91FF; --c-comment:#5AA8EF; --c-like:#FF8DB5; --c-intro:#6E86AB;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
mark{background:linear-gradient(transparent 58%,var(--hl) 58%);color:inherit;padding:0 .08em}
h1,h2,h3,h4{margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}

/* ---------- top ---------- */
.top{position:relative;overflow:hidden}
.top .waves{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand b{font-family:var(--f-num);font-weight:800;font-size:18px;letter-spacing:.02em;color:var(--navy)}
.brand{align-items:center}
.brand .logo{height:44px;width:auto;display:block}
.brand .lg-w{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .lg-c{display:none}:root:not([data-theme="light"]) .brand .lg-w{display:block}}
:root[data-theme="dark"] .brand .lg-c{display:none}
:root[data-theme="dark"] .brand .lg-w{display:block}
.fly-logo{display:block;height:clamp(44px,5vw,64px);width:auto;margin-bottom:10px}
.brand span{font-size:12.5px;color:var(--ink2);letter-spacing:.06em}
.asof{font-size:12px;color:var(--ink2)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;justify-content:center;padding-block:10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
.tabs .in{display:flex;gap:4px;padding:5px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;box-shadow:var(--shadow);max-width:100%}
.tabs button{border:0;background:transparent;border-radius:999px;padding:8px 18px;font-weight:700;font-size:14px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--navy);color:var(--onnavy)}
.pane[hidden]{display:none!important}

/* ---------- hero (my page) ---------- */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:18px 34px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:4px 14px 4px 6px;font-size:13px;font-weight:700;color:var(--navy)}
.eyebrow i{display:grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--gold);color:var(--onGold);font-style:normal;font-family:var(--f-num);font-weight:800;font-size:12px}
.hero h1{font-weight:900;font-size:clamp(28px,4.6vw,48px);color:var(--navy);margin:14px 0 10px;letter-spacing:.01em}
.hero .lead{color:var(--ink2);max-width:32em}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:20px}
.stat{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.stat .k{font-size:11.5px;color:var(--ink2);font-weight:700;line-height:1.4}
.stat .v{font-family:var(--f-num);font-weight:800;font-size:26px;line-height:1.2;color:var(--navy);margin-top:4px}
.stat .v small{font-family:var(--f-body);font-size:12.5px;font-weight:700;margin-left:2px}
.medal{position:relative;display:grid;place-items:center;max-width:340px;width:100%;margin-inline:auto}
.medal svg{width:100%;height:auto;display:block;overflow:visible}
.medal .cap{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.medal .cap .lv{font-family:var(--f-num);font-weight:800;font-size:clamp(40px,7vw,62px);line-height:1;color:var(--navy)}
.medal .cap .lv small{font-size:.42em;margin-right:2px}
.medal .cap .nm{font-weight:900;font-size:clamp(14px,2vw,17px);color:var(--navy);margin-top:6px}
.medal .cap .nx{font-size:12px;color:var(--ink2);margin-top:4px;max-width:12em;line-height:1.5}

/* ---------- sections ---------- */
section{padding-block:30px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-bottom:16px}
.sec-h h2{display:flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(21px,2.8vw,28px);color:var(--navy)}
.sec-h h2 svg{width:24px;height:24px;flex:none}
.sec-h p{color:var(--ink2);font-size:13.5px;max-width:40em}
.panel{background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:22px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none;background:var(--sky);color:#fff;white-space:nowrap}
.btn.ghost{background:var(--paper);color:var(--navy);border:1.5px solid var(--line)}
.btn svg{width:16px;height:16px}

/* ---------- これだけ見ればOK ---------- */
.one{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px 30px;align-items:center;border-width:2px}
.one.good{border-color:var(--good)} .one.near{border-color:var(--near)} .one.push{border-color:var(--push)} .one.done{border-color:var(--gold)}
.one-k{font-size:13px;font-weight:900;color:var(--sky);letter-spacing:.06em}
.one h3{font-size:clamp(19px,2.4vw,23px);color:var(--navy);margin:2px 0 10px}
.gauge{width:100%;height:auto;display:block;overflow:visible;max-width:300px;margin-inline:auto}
.gauge text{font-family:var(--f-num);fill:var(--ink2)}
.vs{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.vs b{font-family:var(--f-num);font-weight:800;font-size:46px;line-height:1;color:var(--navy)}
.vs span{font-family:var(--f-num);font-weight:700;font-size:20px;color:var(--ink2)}
.st{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 14px;font-weight:900;font-size:14px;margin-top:10px}
.st.good{background:var(--good-bg);color:var(--good)} .st.near{background:var(--near-bg);color:var(--near)}
.st.push{background:var(--push-bg);color:var(--push)} .st.start{background:var(--start-bg);color:var(--sky)} .st.done{background:var(--gold);color:var(--onGold)}
.one .say{margin-top:10px;color:var(--ink);font-size:14.5px}
.one .say small{display:block;color:var(--ink2);font-size:12.5px;margin-top:4px}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.ring{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:16px;padding:8px 10px;min-width:0}
.ring svg{width:52px;height:52px;flex:none}
.ring b{display:block;font-size:13px;color:var(--ink);line-height:1.3}
.ring span{font-family:var(--f-num);font-size:13px;color:var(--ink2)}
.ring.ok b::after{content:" ✓";color:var(--good)}

/* ---------- 今日やること ---------- */
.todo{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.td{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 14px;background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:16px 18px;position:relative}
.td .ic{grid-row:span 3;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff}
.td .ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.td h3{font-size:16.5px;color:var(--navy);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.td h3 .pt{font-family:var(--f-num);font-weight:800;font-size:13px;color:var(--onGold);background:var(--gold);border-radius:999px;padding:0 9px}
.td p{font-size:13.5px;color:var(--ink2)}
.td .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.td .tpl{grid-column:2;margin-top:6px;background:var(--bg);border:1.5px dashed var(--mist);border-radius:12px;padding:8px 12px;font-size:13px;white-space:pre-wrap;color:var(--ink)}
.td.did{opacity:.62}
.td.did h3{text-decoration:line-through;text-decoration-thickness:2px}
.allok{display:flex;gap:14px;align-items:center;background:var(--paper);border:2px solid var(--gold);border-radius:20px;padding:16px 18px}
.allok b{font-size:17px;color:var(--navy)}

/* ---------- PHOTO カード ---------- */
.ph-stats{display:flex;gap:10px;flex-wrap:wrap}
.ph-stats .stat{flex:1 1 90px}
.cardzone{background:linear-gradient(180deg,var(--wash) 0%,var(--bg) 100%);border-radius:30px;padding:22px 20px 24px;margin-top:14px}
.cz-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cz-top .cnt{font-family:var(--f-num);font-weight:800;font-size:36px;color:var(--navy);line-height:1}
.cz-top .cnt small{font-size:16px;color:var(--ink2)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.scard{position:relative;background:var(--paper);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.scard-h{background:var(--navy);color:var(--onnavy);display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:10px}
.scard.now .scard-h{background:var(--sky);color:var(--onnavy)}
.scard.later{opacity:.55}
.scard-h .t{font-family:var(--f-num);font-weight:800;letter-spacing:.14em;font-size:12.5px;opacity:.92}
.scard-h .no{font-family:var(--f-num);font-weight:800;font-size:20px}
.scard-h .no small{font-size:11.5px;font-weight:500;opacity:.85;margin-left:6px}
.grid20{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 10px;padding:18px 16px 10px}
.cell{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.slot{position:relative;width:100%;max-width:76px;aspect-ratio:1;border-radius:50%;padding:0;border:0;background:var(--empty);display:grid;place-items:center}
.slot .n{font-family:var(--f-num);font-weight:700;font-size:13px;color:var(--mist)}
.slot.empty{border:2px dashed var(--line);background:transparent}
.slot.filled{cursor:pointer;background:var(--gold);box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--c-photo)}
.slot.filled img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.slot.filled .n{color:var(--onGold);font-weight:800}
.slot.filled .badge{position:absolute;right:-5px;bottom:-5px;background:var(--c-photo);color:#fff;font-family:var(--f-num);font-weight:800;font-size:10.5px;line-height:1;border-radius:999px;padding:3px 5px;border:2px solid var(--paper)}
.slot.next{border:2.5px dashed var(--sky);background:transparent}
.slot.next .n{color:var(--sky);font-size:11px;letter-spacing:.06em;font-weight:800}
.cell .d{font-family:var(--f-num);font-size:11px;color:var(--ink2);line-height:1.2;min-height:1.2em}
.hanko{position:absolute;z-index:3;right:14px;bottom:40px;width:110px;height:110px;border-radius:50%;border:4px double var(--gold);color:var(--gold);display:grid;place-items:center;text-align:center;transform:rotate(-14deg);background:color-mix(in srgb,var(--paper) 86%,transparent);pointer-events:none;line-height:1.1}
.hanko b{font-family:var(--f-num);font-weight:800;letter-spacing:.12em;font-size:14px;display:block}
.scard-f{display:flex;justify-content:space-between;gap:8px;padding:4px 18px 14px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.road{margin-top:20px}
.road-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.road-h b{font-weight:900;color:var(--navy)}
.road-h span{font-size:12.5px;color:var(--ink2)}
.track{position:relative;height:12px;border-radius:999px;background:var(--paper);border:1.5px solid var(--line)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--sky),var(--gold))}
.track .tick{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);background:var(--paper);border:3px solid var(--line)}
.track .tick.on{border-color:var(--gold);background:var(--gold)}
.miles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:14px}
.ml{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;min-width:0}
.ml .m{width:40px;height:40px;margin:0 auto 4px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:15px;background:var(--empty);color:var(--mist);border:2px dashed var(--line)}
.ml .nm{font-size:12px;font-weight:700;line-height:1.4;color:var(--ink2)}
.ml .dt{font-family:var(--f-num);font-size:11px;color:var(--ink2);margin-top:2px}
.ml.on{border-color:var(--gold)} .ml.on .m{background:var(--gold);color:var(--onGold);border:2px solid var(--gold)} .ml.on .nm{color:var(--ink)}
.album{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:clamp(120px,15vw,190px);gap:10px;grid-auto-flow:dense;margin-top:16px}
.tile{position:relative;border:0;padding:0;border-radius:18px;overflow:hidden;cursor:pointer;background:var(--empty);min-width:0}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.tile:hover img{transform:scale(1.04)}
.tile.feat{grid-column:span 2;grid-row:span 2;border-radius:26px}
.tile .ov{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 9px;background:linear-gradient(transparent,rgba(8,18,44,.72));color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:6px;text-align:left}
.tile .ov .dt{font-family:var(--f-num);font-weight:700;font-size:13px}
.tile .ov .pl{font-size:11.5px;font-weight:700;background:var(--gold);color:#1A2F66;border-radius:999px;padding:1px 8px;white-space:nowrap}
.tile .vid{position:absolute;top:10px;left:10px;background:rgba(8,18,44,.7);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 8px}
.howto{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.hw{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:14px;min-width:0}
.hw .sn{width:32px;height:32px;border-radius:50%;background:var(--navy);color:var(--onnavy);display:grid;place-items:center;font-family:var(--f-num);font-weight:800;margin-bottom:6px}
.hw b{display:block;color:var(--navy);font-size:15px}
.hw p{font-size:13px;color:var(--ink2)}
.phrase{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;background:var(--wash);border-radius:14px;padding:10px 14px}
.phrase q{flex:1 1 260px;font-family:var(--f-num);font-weight:700;color:var(--navy);font-size:15px;quotes:"“" "”"}

/* ---------- map ---------- */
.mapbox{position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:22px;padding:14px;margin-top:16px;min-width:0}
.mapbox svg{max-width:860px;margin-inline:auto}
.mapbox svg{width:100%;height:auto;display:block}
.mapbox .sea{fill:color-mix(in srgb,var(--sky) 10%,var(--paper))}
.mapbox .land{fill:var(--wash2);stroke:var(--paper);stroke-width:.8;vector-effect:non-scaling-stroke}
.mapbox .land.on{fill:var(--gold)}
.wmap .ring{fill:#fff;stroke:#F2B705;stroke-width:3;vector-effect:non-scaling-stroke}
.wmap .ring.solid{fill:var(--navy);stroke:#fff}
.wmap .pn{fill:var(--onnavy);font-family:var(--f-num);font-weight:800;text-anchor:middle}
.wmap .bdg{fill:var(--navy);stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
.wmap .bn{fill:#fff;font-family:var(--f-num);font-weight:800;text-anchor:middle}
.wmap .pl{fill:var(--navy);font-weight:900;text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}
.wmap .pulse{fill:none;stroke:#F2B705;stroke-width:2;vector-effect:non-scaling-stroke;opacity:0}
.wmap .lead{stroke:var(--navy);stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-dasharray:3 3}
.wmap .dotp{fill:var(--navy)}
.wmap .pin[data-ph]{cursor:pointer}
.maphead{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:baseline;font-weight:700;color:var(--ink2);margin:2px 4px 10px}
.maphead b{font-family:var(--f-num);font-weight:800;font-size:30px;color:var(--navy);margin-right:3px;line-height:1}
.mapbtn{position:absolute;right:16px;top:14px;border:1.5px solid var(--line);background:var(--paper);color:var(--navy);border-radius:999px;padding:5px 14px;font-size:12.5px;font-weight:700;cursor:pointer}
.mapbox svg.wmap{border-radius:14px}
.ccs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ccs .chip{background:var(--wash);color:var(--navy)}
.ccs .chip b{font-family:var(--f-num)}
.mapnote{font-size:12.5px;color:var(--ink2);margin-top:8px}

/* ---------- 貢献 ---------- */
.lvroad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.lvs{border:1.5px dashed var(--line);border-radius:14px;padding:8px 10px;min-width:0;background:var(--paper)}
.lvs .l{font-family:var(--f-num);font-weight:800;font-size:13px;color:var(--mist)}
.lvs .n{font-size:12.5px;font-weight:700;color:var(--ink2);line-height:1.35}
.lvs .a{font-family:var(--f-num);font-size:11px;color:var(--ink2)}
.lvs.done{border-style:solid;border-color:var(--navy);background:var(--navy)}
.lvs.done .l,.lvs.done .n,.lvs.done .a{color:var(--onnavy)}
.lvs.cur{border:2px solid var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--paper))}
.lvs.cur .l{color:var(--navy)} .lvs.cur .n{color:var(--ink)}
.lvbar{margin-top:12px}
.kinds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
.kd{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;min-width:0;position:relative;overflow:hidden}
.kd::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.kd .k{font-size:12.5px;font-weight:700;color:var(--ink2);padding-left:6px}
.kd .v{font-family:var(--f-num);font-weight:800;font-size:28px;color:var(--navy);line-height:1.2;padding-left:6px}
.kd .v small{font-family:var(--f-body);font-size:12.5px;font-weight:700;margin-left:2px;color:var(--ink2)}
.kd .s{font-size:12px;color:var(--ink2);padding-left:6px}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-top:16px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-num);font-size:11px;fill:var(--ink2)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--navy);stroke-width:1.5;stroke-dasharray:5 4}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;background:var(--c)}
.heat{display:grid;grid-template-columns:24px repeat(12,minmax(0,1fr));gap:4px;align-items:center}
.heat .dl{font-size:10.5px;color:var(--ink2);text-align:right;padding-right:2px}
.heat .ml2{font-family:var(--f-num);font-size:10.5px;color:var(--ink2);text-align:left;white-space:nowrap;overflow:hidden}
.heat i{display:block;aspect-ratio:1;border-radius:4px;background:var(--empty)}
.heat i.h1{background:color-mix(in srgb,var(--sky) 30%,var(--empty))}
.heat i.h2{background:color-mix(in srgb,var(--sky) 58%,var(--empty))}
.heat i.h3{background:var(--sky)}
.heat i.h4{background:var(--gold)}
.heat i.fut{background:transparent;border:1px dashed var(--line)}
.heatlg{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--ink2);margin-top:8px;flex-wrap:wrap}
.heatlg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.facts{display:grid;gap:10px;margin-top:12px}
.fact{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-top:1.5px dashed var(--line);padding-top:8px;font-size:13.5px;color:var(--ink2)}
.fact b{font-family:var(--f-num);font-weight:800;font-size:20px;color:var(--navy)}
.recent{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.recent li{display:grid;grid-template-columns:50px 12px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;color:var(--ink2)}
.recent li i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.recent li b{font-family:var(--f-num);color:var(--navy)}

/* ---------- バッジ ---------- */
.firsts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fs{display:grid;grid-template-columns:36px minmax(0,1fr);gap:2px 10px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px}
.fs .cb{grid-row:span 2;width:32px;height:32px;border-radius:10px;border:2.5px dashed var(--mist);display:grid;place-items:center}
.fs .cb svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;visibility:hidden}
.fs.on .cb{background:var(--good);border:0}
.fs.on .cb svg{visibility:visible}
.fs b{font-size:13.5px;line-height:1.4}
.fs span{font-family:var(--f-num);font-size:11.5px;color:var(--ink2)}
.bgrid{display:grid;gap:10px;margin-top:16px}
.brow{display:grid;grid-template-columns:86px repeat(4,minmax(0,1fr));gap:8px;align-items:center}
.brow .g{font-weight:900;color:var(--navy);font-size:13.5px}
.bd{display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;min-width:0}
.bd .c{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:12px;background:var(--empty);color:var(--mist);border:2px dashed var(--line)}
.bd .t{font-size:11.5px;color:var(--ink2);line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd.on{border-color:var(--gold)}
.bd.on .c{background:var(--gold);color:var(--onGold);border:2px solid var(--gold)}
.bd.on .t{color:var(--ink)}

/* ---------- ルール ---------- */
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rl{display:flex;gap:10px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.rl .p{flex:none;font-family:var(--f-num);font-weight:800;color:var(--onGold);background:var(--gold);border-radius:12px;padding:4px 8px;font-size:15px;min-width:54px;text-align:center}
.rl b{display:block;font-size:13.5px;color:var(--navy);line-height:1.4}
.rl span{font-size:12px;color:var(--ink2);line-height:1.5}

/* ---------- みんな ---------- */
.us-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:center;padding-block:18px 30px;position:relative}
.us-hero h1{font-weight:900;font-size:clamp(28px,4.6vw,46px);color:var(--navy);margin:12px 0 8px}
.glasses{background:var(--paper);border:1.5px solid var(--line);border-radius:26px;padding:18px;box-shadow:var(--shadow)}
.glasses .gt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.glasses .gt b{font-weight:900;color:var(--navy)}
.glasses .gt .big{font-family:var(--f-num);font-weight:800;font-size:44px;color:var(--navy);line-height:1}
.glasses .gt .big small{font-size:18px;color:var(--ink2)}
.gl10{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin-top:12px}
.gl10 svg{width:100%;height:auto;display:block}
.gl10 .cup{fill:none;stroke:var(--mist);stroke-width:2;stroke-linejoin:round}
.gl10 .on .cup{stroke:var(--navy)}
.gl10 .beer{fill:transparent}
.gl10 .on .beer{fill:var(--gold)}
.gl10 .foam{fill:transparent}
.gl10 .on .foam{fill:var(--paper);stroke:var(--navy);stroke-width:1.5}
.totals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.podiums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pdm h3{font-size:16px;color:var(--navy)}
.pdm .sub{font-size:12.5px;color:var(--ink2)}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;margin-top:14px}
.pod{text-align:center;min-width:0}
.pod .who{font-weight:900;font-size:13.5px;color:var(--navy);line-height:1.35;min-height:2.7em;display:flex;align-items:flex-end;justify-content:center;word-break:keep-all;overflow-wrap:anywhere}
.pod .val{font-family:var(--f-num);font-weight:700;font-size:12.5px;color:var(--ink2)}
.pod .blk{border-radius:12px 12px 0 0;background:var(--wash);font-family:var(--f-num);font-weight:800;color:var(--navy);display:grid;place-items:center;margin-top:6px;font-size:20px}
.pod.r1 .blk{height:76px;background:var(--gold);color:var(--onGold)}
.pod.r2 .blk{height:54px}
.pod.r3 .blk{height:40px}
.pod.none .who{color:var(--mist)}
.note{background:var(--wash);border-radius:16px;padding:12px 16px;font-size:13.5px;color:var(--ink)}
.msg{background:var(--paper);border:2px solid var(--push);border-radius:18px;padding:16px 18px;margin-block:16px}
.loading{padding-block:40px;text-align:center;color:var(--ink2)}

footer{padding-block:30px 44px;text-align:center;font-size:12px;color:var(--ink2)}
footer b{font-family:var(--f-num);color:var(--navy);font-size:15px}

/* ---------- dialog ---------- */
dialog{border:0;padding:0;border-radius:24px;background:var(--paper);color:var(--ink);width:min(900px,calc(100vw - 32px));max-height:calc(100vh - 32px);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,18,44,.6)}
.dlg{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.dlg .pic{background:#0B1530;min-height:260px;display:grid;place-items:center}
.dlg .pic img{width:100%;height:100%;max-height:78vh;object-fit:contain;display:block}
.dlg .info{padding:22px 20px;display:flex;flex-direction:column;gap:10px;min-width:0;overflow-y:auto;max-height:78vh}
.dlg .no{font-family:var(--f-num);font-weight:800;color:var(--sky);letter-spacing:.1em;font-size:13px}
.dlg h3{font-size:21px;color:var(--navy)}
.dlg dl{margin:0;display:grid;gap:8px;font-size:13.5px}
.dlg dt{font-weight:700;color:var(--ink2);font-size:12px}
.dlg dd{margin:0;white-space:pre-wrap}
.dlg .nav{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.dlg .nav button{flex:1;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px;font-weight:700;cursor:pointer}
.x{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#15254A;font-size:20px;line-height:1;cursor:pointer;z-index:2}


/* ---------- キービジュアル（写真の一覧＋いまのポイント） ---------- */
.kv-head{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:10px 24px;flex-wrap:wrap;padding-block:12px 16px}
.kv-head h1{font-weight:900;font-size:clamp(28px,4.4vw,46px);color:var(--navy);line-height:1.25;margin:10px 0 0;letter-spacing:.01em}
.kv-head h1 mark{display:inline-block;margin-left:.15em}
.kv-head h1 .nb{display:inline-block}
.eyebrow .demo{margin-left:6px;font-size:11px;font-weight:900;color:var(--onGold);background:var(--hl);border-radius:6px;padding:0 6px}
.kv-count{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2);font-weight:700}
.kv-count b{font-family:var(--f-num);font-weight:800;font-size:30px;color:var(--navy);margin-right:3px;line-height:1}
.kv{position:relative;display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);gap:16px;align-items:start}
.wall{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:clamp(64px,8.2vw,112px);gap:8px;grid-auto-flow:dense}
.wall .ph{position:relative;border:0;padding:0;border-radius:16px;overflow:hidden;background:var(--empty);cursor:pointer;min-width:0}
.wall .ph.big{grid-column:span 3;grid-row:span 3;border-radius:26px;box-shadow:var(--shadow)}
.wall .ph .newest{position:absolute;left:12px;top:12px;background:var(--gold);color:#1A2F66;font-weight:900;font-size:13px;border-radius:999px;padding:3px 12px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.wall .ph.big .pt{font-size:15px;left:12px;bottom:12px;padding:2px 12px}
.wall .ph.big .ch{width:58px;height:58px;right:12px;top:12px;border-width:3px}
.wall .ph.big .ch svg{width:46px;height:46px}
.wall .nx.first{font-size:15px;font-family:var(--f-body);font-weight:900;line-height:1.6}
.wall .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.wall .ph:hover img{transform:scale(1.05)}
.wall .ph .pt{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;color:#fff;background:rgba(8,18,44,.6);border-radius:999px;padding:0 7px;line-height:1.7;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch{position:absolute;right:6px;top:6px;width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid #F2B705;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ch svg{width:29px;height:29px;display:block}
.wall .nx{display:grid;place-items:center;text-align:center;border:2.5px dashed var(--sky);background:transparent;cursor:default;font-family:var(--f-num);font-weight:800;font-size:12px;color:var(--sky);line-height:1.3}
.wall .em{border:2px dashed var(--line);background:transparent;cursor:default}
.skel{background:linear-gradient(100deg,var(--empty) 30%,var(--wash) 50%,var(--empty) 70%) 0 0/300% 100%}
.dash{background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.dash-top{display:flex;gap:12px;align-items:center}
.lvb{flex:none;width:62px;height:62px;border-radius:50%;background:var(--gold);color:var(--onGold);display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:28px;line-height:1;box-shadow:0 0 0 4px var(--paper),0 0 0 7px color-mix(in srgb,var(--gold) 45%,transparent)}
.lvb small{font-size:12px;display:block;margin-bottom:-6px}
.dash-top b{display:block;font-weight:900;font-size:17px;color:var(--navy);line-height:1.3}
.dash-top span{font-size:12.5px;color:var(--ink2)}
.dash-top span b{display:inline;font-size:16px;font-family:var(--f-num)}
.dash .bar{position:relative;height:10px;border-radius:999px;background:var(--empty)}
.dash .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--sky),var(--gold))}
.dash .bar em{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--navy)}
.dash .mini{font-size:12.5px;color:var(--ink2);line-height:1.6}
.dash .mini b{color:var(--navy)}
.wk{background:var(--bg);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.wk-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.wk-h .st{margin-top:0;font-size:12px;padding:1px 10px}
.wk-v{display:flex;align-items:baseline;gap:6px}
.wk-v b{font-family:var(--f-num);font-weight:800;font-size:34px;line-height:1;color:var(--navy)}
.wk-v span{font-weight:700;color:var(--ink2)}
.wkbar i{background:var(--sky)!important}
.nexto{border:2px dashed var(--gold);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.nexto .k{font-size:11.5px;font-weight:900;color:var(--near);letter-spacing:.06em}
.nexto b{font-size:14px;color:var(--navy);line-height:1.5}
.nexto .acts{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.nexto .pt{font-family:var(--f-num);font-weight:800;font-size:13px;color:var(--onGold);background:var(--gold);border-radius:999px;padding:0 10px}
.more{border:0;background:none;color:var(--sky);font-weight:700;font-size:13px;cursor:pointer;text-align:left;padding:2px 0}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fchip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink2)}
.fchip .num{margin-left:6px;font-weight:800}
.fchip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--onnavy)}
.mon{margin-top:14px}
.mon h3{display:flex;align-items:baseline;gap:10px;font-size:16px;color:var(--navy);margin-bottom:8px}
.mon h3 span{font-size:12.5px;color:var(--ink2);font-weight:700}
.mgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.mgrid .tile{aspect-ratio:1;border-radius:14px}
.mgrid .tile .ov{padding:18px 8px 6px}
.mgrid .tile .ov .dt{font-size:11.5px}
.mgrid .tile .ov .pl{font-size:10.5px}
@media (prefers-reduced-motion: no-preference){
  .wall .ph:not(.em):not(.nx){animation:tileIn .5s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc(var(--i,0) * 45ms)}
  .skel{animation:shimmer 1.4s linear infinite}
  .wall .ph.big img{animation:kb 14s ease-in-out infinite alternate}
}
@keyframes tileIn{from{transform:scale(.85) rotate(-2deg)}}
@keyframes shimmer{to{background-position:-300% 0}}
@keyframes kb{to{transform:scale(1.08)}}
@media (max-width: 900px){
  .kv{grid-template-columns:minmax(0,1fr)}
  .mgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width: 640px){
  .wall{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:27vw;gap:6px}
  .wall .mx,.wall .em{display:none}
  .kv-count b{font-size:24px}
  .mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* ---------- みんなのページのキービジュアル（夜の地図に写真） ---------- */
.fly{padding-top:14px}
.fly-stage{position:relative;border-radius:28px;overflow:hidden;background:#0D1D47;box-shadow:0 20px 50px rgba(13,29,71,.35)}
.fly-stage svg{display:block;width:100%;height:auto;aspect-ratio:900/441}
.fl-land{fill:#24427F;stroke:#33549A;stroke-width:.5;vector-effect:non-scaling-stroke;transition:fill .6s}
.fl-land.jp{fill:#F2B705}
.fl-land.lit{fill:#4C7BD9}
.fly-stage .arc{fill:none;stroke:#FFC83D;stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:.95}
.fly-stage .done .arc,.done .arc{stroke-dashoffset:0}
.fly-copy{position:absolute;left:clamp(16px,3vw,34px);top:clamp(14px,2.6vw,30px);color:#fff;pointer-events:none;max-width:60%;background:rgba(9,21,52,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:clamp(12px,1.6vw,18px) clamp(16px,2.2vw,26px) clamp(14px,1.8vw,20px);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.fly-eye{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;color:#FFE27A}
.fly-copy h1{margin:6px 0 0;font-weight:900;font-size:clamp(24px,4vw,44px);line-height:1.3;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.fly-copy h1 span{color:#FFC83D}
.fly-stats{position:absolute;left:clamp(16px,3vw,34px);bottom:clamp(14px,2.6vw,28px);display:flex;gap:10px;flex-wrap:wrap}
.fly-stats div{background:rgba(255,255,255,.95);border-radius:16px;padding:8px 14px;display:flex;align-items:baseline;gap:4px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.fly-stats b{font-family:var(--f-num);font-weight:800;font-size:clamp(22px,3vw,34px);color:#1A2F66;line-height:1}
.fly-stats span{font-size:12.5px;font-weight:700;color:#50617F}
.fly-replay{position:absolute;right:16px;bottom:16px;border:0;border-radius:999px;background:#F2B705;color:#1A2F66;font-weight:900;font-size:13px;padding:8px 16px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.fly-lock{position:absolute;right:16px;top:16px;margin:0;background:rgba(13,29,71,.75);color:#fff;font-size:12px;border-radius:12px;padding:6px 12px;max-width:44%}
.fly-ccs{margin-top:12px}
.tgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.tt{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--empty)}
.tt img{width:100%;height:100%;object-fit:cover;display:block}
.tt .ov{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:12px 5px 3px;background:linear-gradient(transparent,rgba(8,18,44,.65));color:#fff;font-size:10.5px;font-weight:700}
@media (prefers-reduced-motion: no-preference){
  .go .tile{animation:tfly .95s cubic-bezier(.22,.85,.3,1.04) both;animation-delay:var(--d);transform-box:fill-box;transform-origin:center}
  .go .arc{animation:arcDraw 1.15s cubic-bezier(.4,0,.2,1) forwards;animation-delay:var(--d)}
  .go .flab{animation:labIn .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d);transform-box:fill-box;transform-origin:center bottom}
  .go .jpglow{animation:jpPulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .go .jplab{animation:labIn .6s cubic-bezier(.2,1.6,.4,1) .2s both;transform-box:fill-box;transform-origin:center top}
}
@keyframes tpop{0%{transform:scale(0) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes tfly{0%{transform:translate(var(--tx),var(--ty)) scale(.2);opacity:0}10%{opacity:1}100%{transform:none;opacity:1}}
@keyframes arcDraw{to{stroke-dashoffset:0}}
@keyframes labIn{from{transform:scale(0);opacity:0}}
@keyframes jpPulse{0%,100%{transform:scale(.85);opacity:.9}50%{transform:scale(1.15);opacity:.6}}
@media (max-width: 900px){ .tgrid{grid-template-columns:repeat(6,minmax(0,1fr))} }
@media (max-width: 640px){
  .fly-stage{border-radius:20px;display:flex;flex-direction:column}
  .fly-copy{position:static;max-width:none;padding:14px 16px 4px;order:-1;background:none;border:0;box-shadow:none;border-radius:0;-webkit-backdrop-filter:none;backdrop-filter:none}
  .fly-copy h1{font-size:24px}
  .fly-stats{position:static;padding:12px 12px 14px;gap:6px}
  .fly-stats div{padding:6px 10px}
  .fly-replay{position:static;align-self:flex-start;margin:0 12px 14px}
  .fly-lock{position:static;max-width:none;margin:0 12px 12px}
  .tgrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
}

.fly-big{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1.4vw,18px);padding:clamp(14px,2vw,22px) clamp(16px,3vw,34px) clamp(84px,8vw,96px);background:linear-gradient(180deg,#16306A 0%,#0D1D47 100%)}
.fly-big .pc{margin:0;background:#fff;border-radius:14px;padding:7px 7px 0;box-shadow:0 10px 26px rgba(0,0,0,.4);transform:rotate(var(--r));min-width:0}
.fly-big .pc img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}
.fly-big figcaption{display:flex;justify-content:space-between;gap:6px;padding:6px 3px 8px;font-size:12px;font-weight:700;color:#1A2F66;white-space:nowrap;overflow:hidden}
@media (prefers-reduced-motion: no-preference){ .fly-big .pc{animation:pcIn .7s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i) * 110ms)} }
@keyframes pcIn{from{transform:translateY(30px) rotate(calc(var(--r) * -3)) scale(.6);opacity:0}}
@media (max-width: 640px){
  .fly-big{grid-template-columns:repeat(2,minmax(0,1fr));padding:12px 14px 4px}
  .fly-big .pc:nth-child(n+3){display:none}
}
/* ---------- motion ---------- */
@media (prefers-reduced-motion: no-preference){
  .gauge .arc{animation:dash 1.2s cubic-bezier(.2,.9,.25,1) both}
  .medal .prog{animation:dash 1.4s cubic-bezier(.2,.9,.25,1) .2s both}
  .ring .rp{animation:dash 1s cubic-bezier(.2,.9,.25,1) .3s both}
  .slot.next::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--sky);opacity:0;animation:ping 2s ease-out infinite}
  .cell.pop .slot{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  .bars .b{animation:grow .7s cubic-bezier(.2,.9,.25,1) both;transform-box:fill-box;transform-origin:50% 100%;animation-delay:calc(var(--i) * 45ms)}
  .gl10 .on .beer{animation:fillup .8s ease-out both;transform-box:fill-box;transform-origin:50% 100%;animation-delay:calc(var(--i) * 40ms)}
  .st.done{animation:shine 2.4s ease-in-out infinite}
  .wmap .pin{animation:pinIn .6s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i,0) * 160ms + 900ms);transform-box:fill-box;transform-origin:center}
  .wmap .pulse{animation:pinPulse 2.2s ease-out infinite;animation-delay:calc(var(--i,0) * 300ms + 1.5s);transform-box:fill-box;transform-origin:center}
}
@keyframes dash{from{stroke-dashoffset:var(--len)}}
@keyframes pinPulse{0%{opacity:.8;transform:scale(.7)}100%{opacity:0;transform:scale(1.35)}}
@keyframes pinIn{from{transform:scale(0)}}
@keyframes ping{0%{transform:scale(.85);opacity:.6}100%{transform:scale(1.15);opacity:0}}
@keyframes pop{0%{transform:scale(.3) rotate(-18deg)}70%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fillup{from{transform:scaleY(0)}}
@keyframes shine{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 0%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--gold) 30%,transparent)}}

/* ---------- responsive ---------- */
@media (max-width: 900px){
  .hero,.us-hero{grid-template-columns:minmax(0,1fr)}
  .medal{max-width:260px}
  .two{grid-template-columns:minmax(0,1fr)}
  .howto{grid-template-columns:repeat(2,minmax(0,1fr))}
  .miles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .firsts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .totals{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rules{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dlg{grid-template-columns:minmax(0,1fr)}
  .dlg .pic img{max-height:46vh}
  .dlg .info{max-height:none}
}
@media (max-width: 640px){
  .wrap{padding-inline:16px}
  section{padding-block:22px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .one{grid-template-columns:minmax(0,1fr)}
  .rings{grid-template-columns:minmax(0,1fr)}
  .kinds{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lvroad{grid-template-columns:repeat(2,minmax(0,1fr))}
  .album{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:130px}
  .howto{grid-template-columns:minmax(0,1fr)}
  .firsts{grid-template-columns:minmax(0,1fr)}
  .brow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brow .g{grid-column:1/-1}
  .podiums{grid-template-columns:minmax(0,1fr)}
  .totals{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rules{grid-template-columns:minmax(0,1fr)}
  .grid20{gap:10px 8px;padding:14px 10px 8px}
  .hanko{width:88px;height:88px;bottom:36px}
  .cardzone{padding:16px 10px 18px;border-radius:22px}
  .tabs button{padding:7px 12px;font-size:13px}
  .panel{padding:16px}
  .td{grid-template-columns:36px minmax(0,1fr);padding:14px}
  .td .ic{width:36px;height:36px;border-radius:12px}
  .td .tpl{grid-column:1/-1}
}

  const re = /([MmLlHhVvZz])([^MmLlHhVvZz]*)/g;
  while ((m = re.exec(d))){
    const c = m[1], n = (m[2].match(/-?\d*\.?\d+(?:e-?\d+)?/g) || []).map(Number);
    if (c === "M" || c === "m"){
      for (let i = 0; i + 1 < n.length; i += 2){
        x = c === "m" ? x + n[i] : n[i]; y = c === "m" ? y + n[i + 1] : n[i + 1];
        if (i === 0){ cur = [[x, y]]; out.push(cur); sx = x; sy = y; } else cur.push([x, y]);
      }
    } else if (c === "L" || c === "l"){
      for (let i = 0; i + 1 < n.length; i += 2){ x = c === "l" ? x + n[i] : n[i]; y = c === "l" ? y + n[i + 1] : n[i + 1]; if (cur) cur.push([x, y]); }
    } else if (c === "H" || c === "h"){ for (const v of n){ x = c === "h" ? x + v : v; if (cur) cur.push([x, y]); } }
    else if (c === "V" || c === "v"){ for (const v of n){ y = c === "v" ? y + v : v; if (cur) cur.push([x, y]); } }
    else { x = sx; y = sy; }
  }
  return out;
}
const BOX = {};
function mainBox(iso){   // いちばん大きい陸地（本土）の範囲。飛び地や島で地図が広がりすぎないように
  if (BOX[iso]) return BOX[iso];
  const W = window.__WORLD; if (!W || !W.paths[iso]) return null;
  let best = null;
  for (const s of subpaths(W.paths[iso].path)){
    let a = 1e9, b = 1e9, c = -1e9, e = -1e9;
    for (const [x, y] of s){ a = Math.min(a, x); b = Math.min(b, y); c = Math.max(c, x); e = Math.max(e, y); }
    const area = (c - a) * (e - b);
    if (!best || area > best.area) best = {x: a, y: b, w: c - a, h: e - b, area};
  }
  return (BOX[iso] = best);
}
function viewFor(isos){
  const bs = isos.map(mainBox).filter(Boolean);
  if (!bs.length) return {v: FULLV, zoom: false};
  let x0 = Math.min(...bs.map(b => b.x)), y0 = Math.min(...bs.map(b => b.y));
  let x1 = Math.max(...bs.map(b => b.x + b.w)), y1 = Math.max(...bs.map(b => b.y + b.h));
  if (x1 - x0 > 900 * 0.5) return {v: FULLV, zoom: false};   // 世界中に広がったら全体
  const pad = Math.max(x1 - x0, y1 - y0) * 0.55 + 30;          // まわりの国が5つほど入る余白
  x0 -= pad; x1 += pad; y0 -= pad; y1 += pad;
  let w = x1 - x0, h = y1 - y0, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const ar = 1.9;
  if (w / h < ar) w = h * ar; else h = w / ar;
  w = Math.max(w, 190); h = w / ar;
  if (w > 900 * 0.72) return {v: FULLV, zoom: false};
  const v = {x: Math.min(Math.max(cx - w / 2, 0), 900 - w), y: Math.min(Math.max(cy - h / 2, 0), 441 - h), w, h};
  return {v, zoom: true};
}
let MAPN = 0;
function worldMap(counts, label, photoOf){
  const W = window.__WORLD;
  const has = Object.keys(counts).sort((a, b) => counts[b].n - counts[a].n);
  const flag = iso => /^[A-Z]{2}$/.test(iso) ? String.fromCodePoint(...[...iso].map(c => 0x1F1A5 + c.charCodeAt(0))) : "";
  const chips = has.map(k => `<span class="chip">${flag(k)} ${esc(counts[k].name)} <b>${counts[k].n}</b></span>`).join("");
  const nPhotos = has.reduce((s, k) => s + counts[k].n, 0);
  const head = has.length ? `<div class="maphead"><span><b class="num">${has.length}</b>か国の仲間と</span><span><b class="num">${nPhotos}</b>回の乾杯</span></div>` : "";
  if (!W) return `<div class="mapbox">${head}<div class="ccs">${chips || '<span class="mapnote">まだ色のついた国はありません。1枚目の国がここに入ります。</span>'}</div></div>`;
  const id = "map" + (++MAPN);
  const {v, zoom} = viewFor(has);
  const narrow = window.innerWidth < 640;
  const r = v.w * (narrow ? 0.055 : 0.034);
  // ピンの位置（本土の中心）→ 重なったら少しずらす
  const pins = has.map(k => { const b = mainBox(k); return b ? {k, ox: b.x + b.w / 2, oy: b.y + b.h / 2, x: b.x + b.w / 2, y: b.y + b.h / 2} : null; }).filter(Boolean);
  for (let it = 0; it < 40; it++) for (let i = 0; i < pins.length; i++) for (let j = i + 1; j < pins.length; j++){
    const a = pins[i], b = pins[j]; let dx = b.x - a.x, dy = b.y - a.y; const d = Math.hypot(dx, dy) || 0.01, need = r * 3.2;
    if (d < need){ const push = (need - d) / 2; dx /= d; dy /= d; a.x -= dx * push; a.y -= dy * push; b.x += dx * push; b.y += dy * push; }
  }
  const pinSvg = pins.map((p, i) => {
    const c = counts[p.k], ph = photoOf && photoOf[p.k], im = ph && IMGS[ph.id], href = im ? (im.s || im.l) : "";
    const lead = Math.hypot(p.x - p.ox, p.y - p.oy) > r * 0.6 ? `<line x1="${p.ox.toFixed(1)}" y1="${p.oy.toFixed(1)}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" class="lead"/><circle cx="${p.ox.toFixed(1)}" cy="${p.oy.toFixed(1)}" r="${(r * 0.16).toFixed(2)}" class="dotp"/>` : "";
    const body = href
      ? `<clipPath id="${id}c${i}"><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(2)}"/></clipPath><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(r * 1.16).toFixed(2)}" class="ring"/><image href="${href}" x="${(p.x - r).toFixed(1)}" y="${(p.y - r).toFixed(1)}" width="${(2 * r).toFixed(1)}" height="${(2 * r).toFixed(1)}" preserveAspectRatio="xMidYMid slice" clip-path="url(#${id}c${i})"/>`
      : `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(r * 0.9).toFixed(2)}" class="ring solid"/><text x="${p.x.toFixed(1)}" y="${(p.y + r * 0.32).toFixed(1)}" class="pn" style="font-size:${(r * 0.9).toFixed(1)}px">${c.n}</text>`;
    const badge = href ? `<circle cx="${(p.x + r * 0.82).toFixed(1)}" cy="${(p.y - r * 0.82).toFixed(1)}" r="${(r * 0.42).toFixed(2)}" class="bdg"/><text x="${(p.x + r * 0.82).toFixed(1)}" y="${(p.y - r * 0.82 + r * 0.17).toFixed(1)}" class="bn" style="font-size:${(r * 0.5).toFixed(1)}px">${c.n}</text>` : "";
    return `<g class="pin" style="--i:${i}"${ph ? ` data-ph="${ph.i}" role="button" tabindex="0" aria-label="${esc(c.name)}の写真を見る"` : ""}>${lead}<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(r * 1.5).toFixed(2)}" class="pulse"/>${body}${badge}<text x="${p.x.toFixed(1)}" y="${(p.y + r * 1.85).toFixed(1)}" class="pl" style="font-size:${(r * 0.62).toFixed(1)}px">${esc(c.name)}</text></g>`;
  }).join("");
  const paths = Object.entries(W.paths).map(([k, val]) => `<path class="land${counts[k] ? " on" : ""}" d="${val.path}"><title>${esc(counts[k] ? counts[k].name + " " + counts[k].n : val.name)}</title></path>`).join("");
  const vb = `${v.x.toFixed(1)} ${v.y.toFixed(1)} ${v.w.toFixed(1)} ${v.h.toFixed(1)}`;
  return `<div class="mapbox">${head}
    <svg id="${id}" class="wmap" viewBox="${vb}" data-vb="${vb}" data-zoom="${zoom ? 1 : 0}" role="img" aria-label="${esc(label)}"><rect x="0" y="0" width="900" height="441" class="sea"/>${paths}<g class="pins">${pinSvg}</g></svg>
    ${zoom ? `<button class="mapbtn" type="button" data-map="${id}" aria-pressed="false">世界全体で見る</button>` : ""}
    <div class="ccs">${chips || '<span class="mapnote">まだ色のついた国はありません。1枚目の乾杯の相手の国が、ここに色づきます。</span>'}</div></div>`;
}
function tweenVB(svg, from, to, ms){
  const t0 = performance.now(), ease = t => 1 - Math.pow(1 - t, 3);
  const step = now => { const t = Math.min(1, (now - t0) / ms), k = ease(t);
    svg.setAttribute("viewBox", ["x", "y", "w", "h"].map(p => (from[p] + (to[p] - from[p]) * k).toFixed(1)).join(" "));
    if (t < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const vbOf = s => { const [x, y, w, h] = s.split(" ").map(Number); return {x, y, w, h}; };
function initMaps(root){
  root.querySelectorAll("svg.wmap[data-zoom='1']").forEach(svg => {
    const target = vbOf(svg.dataset.vb);
    if (!reduce && "IntersectionObserver" in window && !svg.dataset.done){
      const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)){ io.disconnect(); svg.dataset.done = "1"; tweenVB(svg, FULLV, target, 1600); } }, {threshold: .35});
      io.observe(svg);
    }
  });
  root.querySelectorAll(".mapbtn").forEach(b => b.addEventListener("click", () => {
    const svg = document.getElementById(b.dataset.map), wide = b.getAttribute("aria-pressed") !== "true";
    const from = vbOf(svg.getAttribute("viewBox")), to = wide ? FULLV : vbOf(svg.dataset.vb);
    if (reduce) svg.setAttribute("viewBox", `${to.x} ${to.y} ${to.w} ${to.h}`); else tweenVB(svg, from, to, 900);
    b.setAttribute("aria-pressed", String(wide)); b.textContent = wide ? "撮った国のまわりに寄る" : "世界全体で見る";
  }));
}

let BIG_T = null, BIG_I = 0;
function bigCard(p, i){ return `<figure class="pc" style="--i:${i};--r:${((i * 7) % 9) - 4}deg"><img src="${p.big || p.img}" alt=""><figcaption><span class="num">${md(p.d)}</span>${p.cc[0] ? `<span>${flagOf(p.cc[0])} ${esc((ALL.team.countries.find(c => c.iso === p.cc[0]) || {}).name || "")}</span>` : ""}</figcaption></figure>`; }
function startBig(){
  clearInterval(BIG_T);
  const box = $("flyBig"), S = SHOW(); if (!box || !S) return;
  const bigs = S.photos.filter(p => p.big), pool = bigs.length >= 5 ? bigs : bigs.concat(S.photos.filter(p => !p.big));
  if (!pool.length){ box.remove(); return; }
  const n = window.innerWidth < 640 ? 2 : 5, show = () => { box.innerHTML = Array.from({length: n}, (_, i) => bigCard(pool[(BIG_I + i) % pool.length], i)).join(""); BIG_I = (BIG_I + n) % pool.length; };
  BIG_I = 0; show();
  if (!reduce && pool.length > n) BIG_T = setInterval(show, 3200);
}
function albumCols(n){   // 80枚をPC5列（高さ＝幅×3.2）・スマホ2列（幅×20）で並べたときと同じ広さに収まる列の数
  const k = window.innerWidth < 640 ? 20 : 3.2;
  return Math.max(window.innerWidth < 640 ? 2 : 5, Math.ceil(Math.sqrt(n / k)));
}
function teamAlbum(k){
  return SHOW().photos.slice(0, k).map(p => `<div class="tt"><img src="${p.big || p.img}" alt="" loading="lazy"><span class="ov"><span class="dt num">${md(p.d)}</span>${p.cc[0] ? `<span class="pl">${flagOf(p.cc[0])}</span>` : ""}</span></div>`).join("");
}
function landPoints(svg, step){
  const paths = [...svg.querySelectorAll(".fl-land")].map(p => ({p, b: p.getBBox()}));
  const pts = [];
  for (let y = step / 2; y < 441; y += step) for (let x = step / 2; x < 900; x += step){
    const pt = new DOMPoint(x, y);
    for (const q of paths){ const b = q.b; if (x < b.x || x > b.x + b.width || y < b.y || y > b.y + b.height) continue;
      if (q.p.isPointInFill(pt)){ pts.push({x, y}); break; } }
  }
  return pts;
}
function playFly(force){
  const svg = $("flyMap"), W = window.__WORLD;
  if (!svg || !W || (FLY_PLAYED && !force)) return;
  FLY_PLAYED = true;
  FLY_TIMERS.forEach(clearTimeout); FLY_TIMERS = [];
  const later = (ms, f) => FLY_TIMERS.push(setTimeout(f, ms));
  const TM = ALL.team || {countries: []};
  const jp = mainBox("JP"), J = {x: jp.x + jp.w / 2, y: jp.y + jp.h / 2};
  const lit = new Set(TM.countries.map(c => c.iso));
  svg.classList.remove("go", "done");
  svg.setAttribute("viewBox", "0 0 900 441");
  svg.innerHTML = `<defs><clipPath id="tclip" clipPathUnits="objectBoundingBox"><rect width="1" height="1" rx=".24" ry=".24"/></clipPath>
      <radialGradient id="jpG"><stop offset="0" stop-color="#FFE27A" stop-opacity=".95"/><stop offset=".45" stop-color="#F2B705" stop-opacity=".45"/><stop offset="1" stop-color="#F2B705" stop-opacity="0"/></radialGradient>
      <linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D1D47"/><stop offset="1" stop-color="#16306A"/></linearGradient></defs>
    <rect x="-900" y="-441" width="2700" height="1323" fill="url(#seaG)"/>
    <g class="fl-lands">${Object.entries(W.paths).map(([k, v]) => `<path class="fl-land${k === "JP" ? " jp" : ""}" data-iso="${k}" d="${v.path}"/>`).join("")}</g>
    <g class="fl-tiles"></g><g class="fl-arcs"></g><g class="fl-planes"></g><g class="fl-labels"></g>
    <g class="fl-jp"><circle cx="${J.x}" cy="${J.y}" r="34" fill="url(#jpG)" class="jpglow"/><circle cx="${J.x}" cy="${J.y}" r="3.2" fill="#FFE27A"/>
      <g class="jplab"><rect x="${J.x - 31}" y="${J.y + 9}" width="62" height="13" rx="6.5" fill="#F2B705"/><text x="${J.x}" y="${J.y + 18.2}" text-anchor="middle" font-size="7.6" font-weight="900" fill="#1A2F66">JAPAN から出発</text></g></g>`;
  const step = window.innerWidth < 640 ? 24 : 20, size = step * .9;
  const pts = landPoints(svg, step);

  // 国が分かる写真は、その国の上に
  const photos = SHOW() ? SHOW().photos.slice() : [];
  const taken = new Set(), assign = new Map();
  const nearestFree = (x, y) => { let best = -1, bd = 1e9; pts.forEach((p, i) => { if (taken.has(i)) return; const d = (p.x - x) ** 2 + (p.y - y) ** 2; if (d < bd){ bd = d; best = i; } }); return best; };

async function sha(s){ return new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s))); }

async function openFile(rel, key){
  const r = await fetch(rel, {cache: "no-store"});
  if (!r.ok) throw new Error("notfound");
  const j = await r.json();
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: unb64(j.n)}, key, unb64(j.c));
  const ds = new Blob([plain]).stream().pipeThrough(new DecompressionStream("deflate"));
  return JSON.parse(await new Response(ds).text());
}

  const kinds = [["share", "シェア", C.share || 0, CM.share || 0, "回"], ["comment", "コメント", C.comment || 0, CM.comment || 0, "回"], ["like", "いいね", C.like || 0, CM.like || 0, "回"], ["thread", "スレッド", C.thread || 0, CM.thread || 0, "本"]]
    .map(k => `<div class="kd" style="--c:${KIND[k[0]].c}"><div class="k">${k[1]}</div><div class="v num">${fmt(k[2])}<small>${k[4]}</small></div><div class="s">今月 +${fmt(k[3])}</div></div>`).join("");
  const W = d.weeks, goal = R.week_goal;
  const mx = Math.max(goal * 1.25, ...W.map(w => w.p));
  const cw = 600, ch = 210, pl = 34, pb = 26, pt = 18, bw = (cw - pl - 6) / W.length;
  const y = v => pt + (ch - pt - pb) * (1 - v / mx);
  let bars = "";
  W.forEach((w, i) => {
    let acc = 0; const x = pl + i * bw + bw * .18, wdt = bw * .64;
    // ポイントの内訳（いいねの1日上限で削れた分は、合計に合わせて按分）
    const raw = ORDER.map(k => [k, (w.c[k] || 0) * R.pts[k]]); const rawSum = raw.reduce((s, r) => s + r[1], 0) || 1;
    raw.forEach(([k, v]) => { if (!v) return; const vv = v * w.p / rawSum; const y1 = y(acc), y2 = y(acc + vv);
      bars += `<rect class="b" style="--i:${i}" x="${x.toFixed(1)}" y="${y2.toFixed(1)}" width="${wdt.toFixed(1)}" height="${Math.max(0, y1 - y2).toFixed(1)}" fill="${KIND[k].c}"/>`; acc += vv; });
    if (w.p) bars += `<text x="${(x + wdt / 2).toFixed(1)}" y="${(y(w.p) - 5).toFixed(1)}" text-anchor="middle" style="font-weight:700;fill:var(--navy)">${w.p}</text>`;
    if (w.mission) bars += `<text x="${(x + wdt / 2).toFixed(1)}" y="${(y(w.p) - (w.p ? 18 : 5)).toFixed(1)}" text-anchor="middle" style="fill:var(--gold);font-size:13px">★</text>`;
    if (i % 2 === (W.length - 1) % 2) bars += `<text x="${(x + wdt / 2).toFixed(1)}" y="${ch - 8}" text-anchor="middle">${md(w.w)}</text>`;
  });
  const grid = [0, goal, Math.round(mx / 10) * 10].filter((v, i, a) => a.indexOf(v) === i && v <= mx).map(v => `<line class="gl" x1="${pl}" x2="${cw}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${pl - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${v}</text>`).join("");
  const goalLine = `<line class="goal" x1="${pl}" x2="${cw}" y1="${y(goal).toFixed(1)}" y2="${y(goal).toFixed(1)}"/><text x="${cw}" y="${(y(goal) - 5).toFixed(1)}" text-anchor="end" style="font-weight:700;fill:var(--navy)">週の目標 ${goal}pt</text>`;
  const chart = `<svg viewBox="0 0 ${cw} ${ch}" role="img" aria-label="直近12週のチアーズポイント"><g class="bars">${grid}${goalLine}${bars}</g></svg>`;
  const ws = W.map(w => w.w); let heat = '<span></span>';
  ws.forEach((w, i) => { const dt = new Date(w + "T12:00:00"); heat += `<span class="ml2">${(i === 0 || dt.getDate() <= 7) ? (dt.getMonth() + 1) + "月" : ""}</span>`; });
  const DN = ["月", "", "水", "", "金", "", "日"];
  for (let r = 0; r < 7; r++){
    heat += `<span class="dl">${DN[r]}</span>`;
    ws.forEach(w => { const dt = new Date(w + "T12:00:00"); dt.setDate(dt.getDate() + r);
      const key = dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
      const v = d.days[key] || 0, fut = key > d.today;
      heat += `<i class="${fut ? "fut" : v >= 30 ? "h4" : v >= 15 ? "h3" : v >= 5 ? "h2" : v > 0 ? "h1" : ""}" title="${md(key)} ${v}pt"></i>`; });
  }
  const recent = d.recent.length ? `<ul class="recent">${d.recent.slice(0, 8).map(e => `<li style="--c:${KIND[e.k].c}"><span class="num">${md(e.d)}</span><i></i><span>${KIND[e.k].label}</span><b>+${e.p}</b></li>`).join("")}</ul>` : `<p class="mapnote">まだ記録がありません。今日やることから始めましょう。</p>`;
  const firsts = d.firsts.map(f => `<li class="fs${f.d ? " on" : ""}"><span class="cb">${ICON.check}</span><b>${esc(f.label)}</b><span>${f.d ? md(f.d) + " クリア" : "まだ"}</span></li>`).join("");
  const groups = {}; d.badges.forEach(b => (groups[b.g] = groups[b.g] || []).push(b));
  const UNIT = {"いいね": "回", "コメント": "回", "シェア": "回", "スレッド": "本", "連続": "日", "仲間": "人"};
  const GLABEL = {"連続": "連続で活動", "仲間": "コメントした仲間"};
  const bgrid = Object.entries(groups).map(([g, bs]) => `<div class="brow"><span class="g">${esc(GLABEL[g] || g)}</span>${bs.map(b => `<div class="bd${b.on ? " on" : ""}"><span class="c">${b.n}</span><span class="t">${b.on ? b.n + UNIT[g] + "達成" : "あと" + (b.n - b.have) + UNIT[g]}</span></div>`).join("")}</div>`).join("");

  $("me").innerHTML = `
  <div class="kv-head">
    <div>
      <span class="eyebrow"><i>Lv${L.lv}</i>${esc(L.name)}${d.demo ? '<b class="demo">デモ</b>' : ""}</span>
      <h1><span class="nb">${nm}さんの</span><mark>チアーズPHOTO</mark></h1>
    </div>
    <div class="kv-count"><span><b class="num">${total}</b>枚の写真</span><span><b class="num">${nC}</b>か国の仲間</span><span>今月 <b class="num">${d.photos_month}</b>枚</span></div>
  </div>
  <div class="kv">
    <div class="wall" id="wall">${wallHtml(d)}</div>
    <aside class="dash" aria-label="いまのポイント">
      <div class="dash-top">
        <div class="lvb"><small>Lv</small>${L.lv}</div>
        <div style="min-width:0"><b>${esc(L.name)}</b><span>チアーズポイント <b class="num">${fmt(d.pts.all)}</b>pt</span></div>
      </div>
      <div class="bar"><i style="width:${lvPct}%"></i></div>
      <p class="mini">${L.next ? `次の「${esc(L.next_name)}」まで あと <b class="num">${fmt(L.next - d.pts.all)}</b>pt` : "最高レベル到達！"}</p>
      <div class="wk">
        <div class="wk-h"><span>今週のポイント</span><span class="st ${st.k}">${st.t}</span></div>
        <div class="wk-v"><b class="num">${d.pts.week}</b><span class="num">/ ${R.week_goal}pt</span></div>
        <div class="bar wkbar"><i style="width:${wkPct}%"></i>${st.k !== "done" ? `<em style="left:${pace}%" title="今日までの目安"></em>` : ""}</div>
        <p class="mini">${st.k === "done" ? "今週の目標に届きました！" : `あと <b class="num">${R.week_goal - d.pts.week}</b>pt${reach ? "：" + esc(reach) : ""}`}</p>
      </div>
      ${t0 ? `<div class="nexto"><span class="k">次にやること</span><b>${esc(t0.title)}</b><div class="acts"><span class="pt">+${t0.pts}pt</span><a class="btn" href="${esc(t0.link)}" target="_blank" rel="noopener">${ICON.ext}Discordでひらく</a></div></div>` : `<div class="nexto"><span class="k">次にやること</span><b>今週のミッションはクリア。チアーズPHOTOをもう1枚！</b></div>`}
      <button class="more" type="button" data-go="points">ポイントのくわしい内訳を見る ↓</button>
    </aside>
  </div>

  <section id="stamp">
    <div class="sec-h"><h2>${SPARK}チアーズPHOTOカード</h2><p>人と写っている写真1枚ごとに、スタンプが1つ。20個でカード1枚、100個でゴールです。</p></div>
    <div class="cardzone">
      <div class="cz-top"><span class="cnt num">${total}<small>/100</small></span>${total ? `<button class="btn" type="button" id="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg><span>最初から押していく</span></button>` : ""}</div>
      <div class="cards" id="cards">${photoCards(d)}</div>
      <div class="road">
        <div class="road-h"><b>100枚までの道のり</b><span>${nextMile ? `次は「${nextMile[1]}」まで あと${nextMile[0] - total}枚` : "ゴール達成！"}</span></div>
        <div class="track"><div class="fill" style="width:${Math.min(100, total)}%"></div>${PHOTO_MILES.map(m => `<span class="tick${total >= m[0] ? " on" : ""}" style="left:${m[0]}%"></span>`).join("")}</div>
        <div class="miles">${miles}</div>
      </div>
    </div>
  </section>

  ${total ? `<section id="album">
    <div class="sec-h"><h2>${SPARK}アルバム</h2><p>Discordに投稿した写真と、アンバサダーで提出した写真。タップすると大きく見られます。</p></div>
    <div class="fchips" role="group" aria-label="写真の種類">${chips}</div>
    <div id="albumGrid">${albumHtml(d)}</div>
  </section>` : ""}

  <section>
    <div class="sec-h"><h2>${SPARK}乾杯した仲間の国</h2><p>写真に書いた「誰と、どこで」から、仲間の国に色がつきます。</p></div>
    ${worldMap(ccP, "写真の仲間の国の地図", latestByCc)}
  </section>

  <section>
    <div class="sec-h"><h2>${SPARK}今日やること</h2><p>多くて3つ。上から順にどうぞ。押すとDiscordが開きます。</p></div>
    ${todos}
  </section>

  <section id="points">
    <div class="panel one ${st.k}">
      <div>${gaugeSvg(d, st)}</div>
      <div>
        <span class="one-k">これだけ見ればOK</span>
        <h3>今週のチアーズポイント</h3>
        <div class="vs"><b>${d.pts.week}</b><span>/ ${R.week_goal}pt</span></div>
        <span class="st ${st.k}">${st.t}</span>
        <p class="say">${st.k === "done" ? "今週の目標に届きました。この調子で仲間を応援しましょう！" : `今週あと <b class="num">${R.week_goal - d.pts.week}</b>pt。${reach ? esc(reach) + " で届きます。" : ""}`}<small>先週は ${d.pts.last_week}pt${d.pts.last_week >= R.week_goal ? "（目標達成）" : ""}。週は月曜はじまりです。</small></p>
        <div class="rings">
          <div class="ring${M.like.now >= M.like.goal ? " ok" : ""}">${ringSvg(M.like.now, M.like.goal, "var(--c-like)")}<div><b>いいね</b><span>${M.like.now} / ${M.like.goal}回</span></div></div>
          <div class="ring${M.comment.now >= M.comment.goal ? " ok" : ""}">${ringSvg(M.comment.now, M.comment.goal, "var(--c-comment)")}<div><b>コメント</b><span>${M.comment.now} / ${M.comment.goal}回</span></div></div>
          <div class="ring${M.share.now >= M.share.goal ? " ok" : ""}">${ringSvg(M.share.now, M.share.goal, "var(--c-share)")}<div><b>シェア</b><span>${M.share.now} / ${M.share.goal}回</span></div></div>
        </div>
      </div>
    </div>
  </section>

  <section>
    <div class="sec-h"><h2>${SPARK}Cheers mateへの貢献</h2><p>いいね・コメント・シェア。仲間を応援した分だけ、ポイントとレベルが上がります。</p></div>
    <div class="lvroad">${lvroad}</div>
    <div class="lvbar track"><div class="fill" style="width:${lvPct}%"></div></div>
    <div class="kinds">${kinds}</div>
    <div class="two">
      <div class="panel chart"><h3 style="font-size:15px;color:var(--navy)">週ごとのチアーズポイント（直近12週）</h3>${chart}
        <div class="legend">${ORDER.map(k => `<span><i style="--c:${KIND[k].c}"></i>${KIND[k].label}</span>`).join("")}<span style="color:var(--gold)">★</span>ミッション達成の週</div></div>
      <div class="panel"><h3 style="font-size:15px;color:var(--navy)">活動カレンダー</h3>
        <div class="heat" style="margin-top:10px">${heat}</div>
        <div class="heatlg">少ない <i style="background:var(--empty)"></i><i style="background:color-mix(in srgb,var(--sky) 30%,var(--empty))"></i><i style="background:color-mix(in srgb,var(--sky) 58%,var(--empty))"></i><i style="background:var(--sky)"></i><i style="background:var(--gold)"></i> 30pt以上</div>
        <div class="facts">
          <div class="fact"><span>あなたの投稿に集まったいいね</span><b>${fmt(d.received)}</b></div>
          <div class="fact"><span>いちばん長く続いた連続日数</span><b>${d.best_streak}<small style="font-size:12px">日</small></b></div>
          <div class="fact"><span>コメントした仲間</span><b>${d.mates}<small style="font-size:12px">人</small></b></div>
        </div>
        <h4 style="margin-top:14px;font-size:13.5px;color:var(--navy)">最近ふえたポイント</h4>${recent}
      </div>
    </div>
  </section>

  <section>
    <div class="sec-h"><h2>${SPARK}はじめの一歩</h2><p>クリアするとチェックが入ります。</p></div>
    <ul class="firsts">${firsts}</ul>
    <h3 style="margin-top:22px;color:var(--navy);font-size:17px">バッジ</h3>
    <div class="bgrid">${bgrid}</div>
  </section>

  <section>
    <div class="sec-h"><h2>${SPARK}ポイントのため方</h2></div>
    ${rulesHtml()}
  </section>

  <section>
    <div class="sec-h"><h2>${SPARK}チアーズPHOTOの撮り方</h2></div>
    ${howto}
  </section>`;
  bindMe();
}
function bindMe(){
  const root = $("me");
  initMaps(root);
  root.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => copyText(b.dataset.copy, b)));
  root.querySelectorAll("[data-did]").forEach(b => b.addEventListener("click", () => {
    const k = "did-" + ME.today + "-" + b.dataset.did, on = store(k) === "1";
    store(k, on ? null : "1");
    const li = b.closest(".td"); li.classList.toggle("did", !on);
    b.textContent = !on ? "やった！（取り消す）" : "やったらチェック"; b.setAttribute("aria-pressed", String(!on));
  }));
  root.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { const t = $(b.dataset.go); if (t) t.scrollIntoView({behavior: reduce ? "auto" : "smooth"}); }));
  root.querySelectorAll("[data-af]").forEach(b => b.addEventListener("click", () => {
    AFILTER = b.dataset.af;
    root.querySelectorAll("[data-af]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    $("albumGrid").innerHTML = albumHtml(ME);
  }));
  const play = $("play");
  if (play) play.addEventListener("click", () => {
    const cells = root.querySelectorAll("#cards .cell[data-cell]");
    if (reduce) return;
    cells.forEach(c => c.style.visibility = "hidden");
    cells.forEach((c, i) => setTimeout(() => { c.style.visibility = ""; c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); }, 160 * (i + 1)));
  });
}
if (!window.__meClick){ window.__meClick = true; $("me").addEventListener("click", e => { const b = e.target.closest("[data-ph]"); if (b) openDlg(+b.dataset.ph); }); }
let cur = 0;
function openDlg(i){
  const p = PH[i]; if (!p) return; cur = i;
  const im = IMGS[p.id];
  $("dImg").src = im ? (im.l || im.s) : ""; $("dImg").alt = jpd(p.d) + "の写真";
  $("dNo").textContent = "No." + String(i + 1).padStart(3, "0") + "・" + (p.chal ? "チアーズPHOTOチャレンジ" : SRC[p.src] || "");
  $("dDate").textContent = jpd(p.d);
  $("dCc").innerHTML = p.cc.map(c => `<span class="chip">${esc(c.name)}</span>`).join("");
  $("dDl").innerHTML = (p.where ? `<div><dt>誰と、どこで？</dt><dd>${esc(p.where)}</dd></div>` : "") + (p.note ? `<div><dt>よかったこと、気づいたこと</dt><dd>${esc(p.note)}</dd></div>` : "") + (p.cap ? `<div><dt>ひとこと</dt><dd>${esc(p.cap)}</dd></div>` : "");
  $("dPrev").disabled = i === 0; $("dNext").disabled = i === PH.length - 1;
  const dlg = $("dlg"); if (!dlg.open) dlg.showModal();
}
$("dlgX").addEventListener("click", () => $("dlg").close());
$("dlg").addEventListener("click", e => { if (e.target === $("dlg")) $("dlg").close(); });
$("dPrev").addEventListener("click", () => openDlg(cur - 1));
$("dNext").addEventListener("click", () => openDlg(cur + 1));

/* ---------- タブ ---------- */
function showTab(k){
  ["me", "us"].forEach(x => { const on = x === k; $("tab-" + x).setAttribute("aria-selected", String(on)); $("pane-" + x).hidden = !on; });
}
$("tab-me").addEventListener("click", () => showTab("me"));
$("tab-us").addEventListener("click", () => { showTab("us"); playFly(); });

async function boot(){
  const a = new Date(ALL.asof);
  $("asof").textContent = `${a.getMonth() + 1}/${a.getDate()} ${String(a.getHours()).padStart(2, "0")}:${String(a.getMinutes()).padStart(2, "0")} 更新`;
  try { if (ALL.public_photos) PUBLIC = await (await fetch(ALL.public_photos)).json(); } catch (e) {}
  renderUs();
  const tok = (location.hash || "").replace(/^#/, "");
  if (!/^[A-Za-z0-9]{24}$/.test(tok)){ $("tabs").hidden = true; showTab("us"); playFly(); return; }
  $("tabs").hidden = false; showTab("me");
  try {
    const id = hex(await sha("cm-mypage-id:" + tok)).slice(0, 24);
    const key = await crypto.subtle.importKey("raw", await sha("cm-mypage-key:" + tok), "AES-GCM", false, ["decrypt"]);
    const d = await openFile("u/" + id + ".json", key);
    LOADED = !(d.photo_files || []).length;
    renderMe(d);
    await Promise.all((d.photo_files || []).slice().reverse().map(f => openFile(f, key).then(x => Object.assign(IMGS, x)).catch(() => {})));
    if (!LOADED){ LOADED = true; const y = window.scrollY; renderMe(d); window.scrollTo(0, y); }
    if (d.team){
      try {
        const tkey = await crypto.subtle.importKey("raw", unb64(d.team.k), "AES-GCM", false, ["decrypt"]);
        TEAM = await openFile(d.team.f, tkey);
        renderUs();
      } catch (e) {}
    }
  } catch (e) {
    $("me").innerHTML = `<div class="msg"><b>このリンクでは、あなたのページを開けませんでした。</b><p style="color:var(--ink2);margin-top:6px">運営から届いたリンクを、最後まで（# のうしろも含めて）そのまま開いてください。それでも開けないときは、運営に一言ください。</p></div>`;
  }
}
window.addEventListener("hashchange", () => location.reload());
boot();
})();
</script>
