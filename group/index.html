<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>わたしの行動ページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
/* Layout: スマホ1列。ロイヤルブルーのKV（大きな英字「Day 12.」＋浮かぶ球体＋傾いた3Dパネル）→ 紺の立体カード3枚（継続・貢献・ルール）
   → 毎日の行動（面取りしたタイルのカレンダー）→ ルール（英字タグ）→ 貢献ランキング（立体の表彰台）→ グループ → 数え方。
   参考：チアーズGO! つかいかたブック（紺〜ロイヤルブルー・黄〜クリームの英字・白い浮いたカード）＋ cheersmate11.com */
:root {
  color-scheme: light;
  --bg: #F3F5FA; --surface: #FFFFFF; --ink: #13204A; --muted: #5B6787; --faint: #98A2BB; --line: #E1E6F0; --track: #E8ECF5;
  --r1: #0F1846; --r2: #1E3488; --r3: #2F52C2; --sky: #7FC4F5;
  --yellow: #F7C843; --cream: #FFE7A0; --gold-edge: #B98A1E; --yellow-ink: #7A5A00; --yellow-soft: #FFF6DA;
  --blue: #2C7BD6; --blue-soft: #E6F0FB; --teal: #12957A; --violet: #6B4FE0;
  --ok: #22A06B; --ok-soft: #E1F5EC; --warn: #E58A1F; --warn-soft: #FDEFD9; --bad: #DE4B3E; --bad-soft: #FCE6E3;
  --t0: #E9EDF5; --t1: #CFE3F9; --t2: #8EC0F0; --t3: #3B86DA; --t4: #1B4FA8;
  --lift: inset 0 1px 0 rgba(255,255,255,.9), 0 2px 4px rgba(19,32,74,.05), 0 22px 44px -18px rgba(19,32,74,.32);
  --jp: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  --en: "Inter", "Helvetica Neue", Arial, sans-serif;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1022; --surface: #141B35; --ink: #E8ECF8; --muted: #A2ACC8; --faint: #66709A; --line: #252F55; --track: #1D2547;
    --yellow-ink: #F7C843; --yellow-soft: #2A2512; --blue: #5EA2F0; --blue-soft: #16264A; --teal: #3CC3A2; --violet: #9C86FF;
    --ok: #4CC98E; --ok-soft: #10291F; --warn: #F2A64B; --warn-soft: #2D2210; --bad: #F07468; --bad-soft: #301816;
    --t0: #1B2346; --t1: #1C3666; --t2: #24589A; --t3: #3B86DA; --t4: #8CC2F5;
    --lift: inset 0 1px 0 rgba(255,255,255,.06), 0 2px 4px rgba(0,0,0,.3), 0 22px 44px -18px rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1022; --surface: #141B35; --ink: #E8ECF8; --muted: #A2ACC8; --faint: #66709A; --line: #252F55; --track: #1D2547;
  --yellow-ink: #F7C843; --yellow-soft: #2A2512; --blue: #5EA2F0; --blue-soft: #16264A; --teal: #3CC3A2; --violet: #9C86FF;
  --ok: #4CC98E; --ok-soft: #10291F; --warn: #F2A64B; --warn-soft: #2D2210; --bad: #F07468; --bad-soft: #301816;
  --t0: #1B2346; --t1: #1C3666; --t2: #24589A; --t3: #3B86DA; --t4: #8CC2F5;
  --lift: inset 0 1px 0 rgba(255,255,255,.06), 0 2px 4px rgba(0,0,0,.3), 0 22px 44px -18px rgba(0,0,0,.6); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--jp); font-size: 14px; line-height: 1.65; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button { font: inherit; color: inherit; }
.n { font-family: var(--en); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.wrap { max-width: 900px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.bar { background: var(--r1); color: #fff; }
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.bar img { height: 30px; width: auto; display: block; }
.badge { font: 800 11px var(--en); letter-spacing: .14em; color: var(--r1); background: linear-gradient(180deg, var(--cream), var(--yellow)); border-radius: 99px; padding: 4px 10px; box-shadow: 0 2px 0 var(--gold-edge); }

.switch { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.switch button { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--muted); box-shadow: 0 3px 0 var(--line); display: inline-flex; gap: 8px; align-items: center; }
.switch button b { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--track); font: 800 12px var(--en); color: var(--ink); text-transform: uppercase; }
.switch button[aria-pressed="true"] { background: var(--r2); border-color: var(--r2); color: #fff; box-shadow: 0 3px 0 var(--r1); }
.switch button[aria-pressed="true"] b { background: var(--yellow); color: var(--r1); }

.eyebrow { font: 800 11.5px var(--en); letter-spacing: .2em; color: var(--blue); text-transform: uppercase; }

/* KV */
.kv { position: relative; margin-top: 14px; border-radius: 28px; overflow: hidden; color: #fff; isolation: isolate;
  background: radial-gradient(60% 70% at 88% 12%, rgba(127,196,245,.42), transparent 62%), radial-gradient(55% 60% at 0% 100%, rgba(247,200,67,.22), transparent 60%), linear-gradient(140deg, var(--r1) 0%, var(--r2) 58%, var(--r3) 100%);
  box-shadow: 0 30px 60px -28px rgba(15,24,70,.7); }
.kv-in { position: relative; z-index: 2; padding: 24px 22px 26px; display: grid; gap: 14px; }
.kv .eyebrow { color: var(--sky); }
.kv .hello { font-size: 14px; color: rgba(255,255,255,.75); }
.kv .hello b { color: #fff; font-size: 18px; font-weight: 900; margin-right: 8px; }
.disp { font: 900 clamp(64px, 19vw, 132px)/.86 var(--en); letter-spacing: -.055em; margin: 4px 0 2px; }
.disp .l1 { display: block; color: #fff; filter: drop-shadow(0 3px 0 rgba(0,0,0,.18)) drop-shadow(0 14px 18px rgba(4,10,40,.35)); }
.disp .l2 { display: block; background: linear-gradient(180deg, #FFF6D6 0%, var(--cream) 40%, var(--yellow) 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 #D9A92C) drop-shadow(0 2px 0 #B98A1E) drop-shadow(0 2px 0 #9A7014) drop-shadow(0 16px 18px rgba(4,10,40,.45)); }
.kv .jp { font-size: clamp(18px, 4.6vw, 24px); font-weight: 900; }
.kv .jp .sub { font-size: 13px; font-weight: 500; color: rgba(255,255,255,.75); margin-left: 6px; }
.orb { position: absolute; border-radius: 50%; z-index: 1; pointer-events: none; animation: float 7s ease-in-out infinite; }
.orb.g { width: 92px; height: 92px; right: 26px; top: 30px; background: radial-gradient(circle at 32% 28%, #FFFBEA 0, #FFE7A0 16%, #F7C843 42%, #C9951C 78%, #8C6410 100%); box-shadow: 0 24px 30px -12px rgba(0,0,0,.45), inset -8px -10px 18px rgba(120,80,0,.35); }
.orb.b { width: 54px; height: 54px; right: 120px; top: 110px; background: radial-gradient(circle at 30% 28%, #FFFFFF 0, #CFE8FF 18%, #6FB3F2 48%, #2A62C2 85%); box-shadow: 0 18px 24px -10px rgba(0,0,0,.45), inset -6px -8px 12px rgba(10,30,90,.35); animation-delay: -2.5s; }
.orb.s { width: 26px; height: 26px; right: 22px; top: 150px; background: radial-gradient(circle at 30% 28%, #fff 0, #FFE7A0 30%, #E2AE2E 100%); box-shadow: 0 10px 14px -6px rgba(0,0,0,.4); animation-delay: -4s; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
/* 傾いた3Dパネル（道のり） */
.stage { perspective: 900px; margin-top: 4px; max-width: 520px; }
.tilt { background: rgba(255,255,255,.96); color: var(--ink); border-radius: 22px; padding: 16px 16px 14px; transform: rotateX(10deg) rotateY(-6deg) rotateZ(-.6deg); transform-origin: 50% 100%;
  box-shadow: 0 2px 0 #C9D3EA, 0 6px 0 #AEB9D6, 0 28px 40px -16px rgba(0,0,0,.55); display: grid; gap: 10px; transition: transform .5s cubic-bezier(.2,.8,.2,1); }
.tilt:hover { transform: rotateX(4deg) rotateY(-2deg); }
.tilt .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tilt .top .k { font: 800 11px var(--en); letter-spacing: .16em; color: var(--blue); }
.tilt .top .v { font-size: 13px; color: var(--muted); }
.tilt .top .v b { font: 900 22px var(--en); color: var(--ink); }
.cells { display: grid; gap: 5px; }
.cell { aspect-ratio: 1; border-radius: 9px; display: grid; place-items: center; font: 800 10.5px var(--en); background: var(--t0); color: var(--faint); box-shadow: inset 0 -2px 0 rgba(19,32,74,.08); }
.cell.y { background: linear-gradient(180deg, #FFE7A0, #F7C843); color: #5A4200; box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 3px 0 var(--gold-edge); }
.cell.x { background: transparent; color: var(--faint); border: 1.5px dashed #C7CFE2; box-shadow: none; }
.cell.t { box-shadow: 0 0 0 3px rgba(44,123,214,.35), inset 0 -2px 0 rgba(19,32,74,.08); }
.lab { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
.msg { display: inline-flex; align-items: center; gap: 10px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); border-radius: 16px; padding: 9px 14px; font-size: 13.5px; font-weight: 700; justify-self: start; backdrop-filter: blur(6px); }
.msg i { flex: none; width: 10px; height: 10px; border-radius: 50%; background: #7EE2A8; box-shadow: 0 0 0 4px rgba(126,226,168,.22); }
.msg.wait i { background: var(--yellow); box-shadow: 0 0 0 4px rgba(247,200,67,.28); }

/* 3つの指標（紺の立体カード） */
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 16px; perspective: 1000px; }
.ind { position: relative; overflow: hidden; border-radius: 24px; padding: 18px 16px 16px; color: #fff; display: grid; gap: 6px; align-content: start;
  background: radial-gradient(80% 60% at 100% 0%, rgba(127,196,245,.25), transparent 60%), linear-gradient(160deg, #1A2C78, #101A4E);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 4px 0 #0A1236, 0 24px 36px -18px rgba(10,18,54,.8); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.ind:hover { transform: translateY(-4px) rotateX(4deg); }
.ind .no { position: absolute; right: 8px; top: -14px; font: 900 96px/1 var(--en); letter-spacing: -.06em; color: rgba(255,255,255,.07); pointer-events: none; }
.ind .k { font: 800 11px var(--en); letter-spacing: .18em; color: var(--yellow); }
.ind .t { font-size: 16px; font-weight: 900; }
.ind .row { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
.ring { position: relative; width: 104px; height: 104px; flex: none; filter: drop-shadow(0 8px 10px rgba(0,0,0,.35)); }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 11; }
.ring .bg { stroke: rgba(255,255,255,.12); }
.ring .fg { stroke-linecap: round; transition: stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1); }
.ring .v { position: absolute; inset: 0; display: grid; place-items: center; font: 900 28px var(--en); letter-spacing: -.03em; }
.ring .v small { font-size: 13px; color: rgba(255,255,255,.7); }
.ind .side { display: grid; gap: 4px; font-size: 12.5px; color: rgba(255,255,255,.78); }
.ind .side b { color: #fff; font: 800 15px var(--en); }
.ind .pt { font: 900 52px/1 var(--en); letter-spacing: -.04em; background: linear-gradient(180deg, #FFF6D6, var(--yellow)); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 #B98A1E) drop-shadow(0 8px 10px rgba(0,0,0,.35)); }
.ind .pt small { font-size: 16px; }
.ind .rank { font-size: 12.5px; color: rgba(255,255,255,.8); } .ind .rank b { font: 900 22px var(--en); color: #fff; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.chip { display: inline-flex; gap: 3px; align-items: center; padding: 2px 9px; border-radius: 99px; font: 800 12px var(--en); background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); }
.lt .chip { background: var(--surface); border-color: var(--line); color: var(--ink); }

section.sec { margin-top: 30px; }
.sec-h { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 12px; }
.sec-h h2 { font-size: clamp(20px, 5vw, 24px); font-weight: 900; color: var(--ink); margin-top: 4px; letter-spacing: .01em; }
.sec-h .note { font-size: 12px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--lift); }

/* 毎日の行動 */
.calw { padding: 18px; display: grid; gap: 12px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .h { text-align: center; font: 800 11px var(--en); color: var(--muted); }
.cal .h.sa { color: var(--blue); } .cal .h.su { color: var(--bad); }
.cal .d { aspect-ratio: 1.12; border-radius: 12px; background: var(--t0); display: grid; align-content: center; justify-items: center; line-height: 1.1; box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 -3px 0 rgba(19,32,74,.07); }
.cal .d .dt { font: 700 10px var(--en); color: var(--muted); }
.cal .d .c { font: 900 15px var(--en); letter-spacing: -.02em; }
.cal .d.l1 { background: linear-gradient(180deg, #E4F0FC, var(--t1)); } .cal .d.l2 { background: linear-gradient(180deg, #B6D7F7, var(--t2)); }
.cal .d.l3 { background: linear-gradient(180deg, #5A9BE3, var(--t3)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 3px 0 #1F5CB0; }
.cal .d.l4 { background: linear-gradient(180deg, #2B66C6, var(--t4)); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 3px 0 #10306E; }
.cal .d.l3 .dt, .cal .d.l4 .dt, .cal .d.l3 .c, .cal .d.l4 .c { color: #fff; }
.cal .d.po { box-shadow: inset 0 0 0 2px var(--yellow), inset 0 -3px 0 rgba(19,32,74,.07); }
.cal .d.fu, .cal .d.blank { background: transparent; box-shadow: none; }
.cal .d.td { outline: 2.5px solid var(--ink); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 13px; height: 13px; border-radius: 4px; display: inline-block; }
.calsum { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
.calsum b { font: 900 20px var(--en); letter-spacing: -.02em; }

/* ルール */
.goal { margin: 16px 16px 0; border-radius: 18px; padding: 14px 16px; display: grid; gap: 4px; background: linear-gradient(120deg, #FFF3C8, #FFE39A); color: #3B2C00; box-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 3px 0 #E2B847; }
.goal .k { font: 900 11px var(--en); letter-spacing: .2em; color: #8A6500; }
.goal .t { font-weight: 900; font-size: 16px; }
.goal .s { font-size: 12.5px; color: #6B5300; }
.rules { padding: 6px 16px 16px; display: grid; }
.rule { padding: 14px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; }
.rule:last-child { border-bottom: 0; }
.tag { grid-row: span 3; align-self: start; min-width: 58px; height: 34px; padding: 0 8px; border-radius: 10px; display: grid; place-items: center; font: 800 12.5px var(--en); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 3px 0 rgba(0,0,0,.18); }
.tag.daily { background: linear-gradient(180deg, #3A6FD8, #2550B5); } .tag.week { background: linear-gradient(180deg, #1AA588, #108068); } .tag.post { background: linear-gradient(180deg, #7C62F0, #5B40D0); }
.tag.react { background: linear-gradient(180deg, #F08A4B, #D96A28); } .tag.cheer { background: linear-gradient(180deg, #E05A8C, #C23E70); } .tag.off { background: linear-gradient(180deg, #6B7799, #4E5978); } .tag.none { background: var(--track); color: var(--muted); box-shadow: none; }
.rule .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.rule .lb { font-weight: 700; font-size: 14px; }
.rule .rv { font: 900 22px var(--en); white-space: nowrap; letter-spacing: -.02em; }
.rule .rv small { font-size: 12px; color: var(--muted); }
.rbar { height: 12px; border-radius: 99px; background: var(--track); position: relative; box-shadow: inset 0 2px 3px rgba(19,32,74,.1); }
.rbar i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; box-shadow: inset 0 1px 0 rgba(255,255,255,.45); }
.rbar b { position: absolute; top: -4px; bottom: -4px; width: 3px; border-radius: 2px; background: var(--ink); opacity: .55; }
.rule .ex { font-size: 12px; color: var(--muted); }
.rule.unm .lb { color: var(--muted); }
.mini { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; background: var(--track); color: var(--muted); margin-left: 6px; vertical-align: 2px; }
.weeks { display: flex; gap: 6px; flex-wrap: wrap; }
.wk { font-size: 11.5px; padding: 2px 8px; border-radius: 8px; background: var(--bg); }
.wk.ok { background: var(--ok-soft); color: var(--ok); font-weight: 700; } .wk.ng { background: var(--bad-soft); color: var(--bad); font-weight: 700; }

/* 貢献 */
.rk { padding: 18px; display: grid; gap: 16px; }
.mine { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mine div { border-radius: 18px; padding: 12px 8px; text-align: center; display: grid; gap: 2px; background: var(--bg); box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 3px 0 var(--line); }
.mine .e { font-size: 22px; line-height: 1.2; }
.mine .v { font: 900 28px var(--en); line-height: 1.1; letter-spacing: -.03em; }
.mine .l { font-size: 12px; color: var(--muted); font-weight: 700; }
.mine .w { font: 700 11.5px var(--en); color: var(--ok); }
.fav { font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fav span { font-size: 22px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; background: var(--track); border-radius: 14px; padding: 4px; gap: 3px; box-shadow: inset 0 2px 3px rgba(19,32,74,.08); }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 10px; cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: linear-gradient(180deg, #FFEFB8, var(--yellow)); color: #3B2C00; box-shadow: 0 3px 0 var(--gold-edge); }
.podium { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; padding-top: 28px; }
.pod { position: relative; display: grid; justify-items: center; align-content: end; text-align: center; gap: 4px; padding: 16px 6px 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 4px 0 var(--line); min-width: 0; }
.pod.p1 { padding-top: 32px; padding-bottom: 22px; border-color: var(--yellow); background: linear-gradient(180deg, var(--yellow-soft), var(--surface) 75%); animation: glow 2.4s ease-in-out infinite; }
.pod.p2 { animation: floaty 3.4s ease-in-out infinite; } .pod.p3 { animation: floaty 3.4s ease-in-out .5s infinite; }
.podium.go .pod.p1 { animation: rise .7s cubic-bezier(.2, 1.3, .4, 1) both, glow 2.4s ease-in-out .8s infinite; }
.podium.go .pod.p2 { animation: rise .7s cubic-bezier(.2, 1.3, .4, 1) .12s both, floaty 3.4s ease-in-out .9s infinite; }
.podium.go .pod.p3 { animation: rise .7s cubic-bezier(.2, 1.3, .4, 1) .24s both, floaty 3.4s ease-in-out 1.3s infinite; }
.pod.me { border-color: var(--blue); box-shadow: 0 4px 0 var(--blue); }
.pod .shine { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
.pod .shine::before { content: ""; position: absolute; top: -50%; left: -70%; width: 45%; height: 200%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); transform: rotate(20deg); animation: sweep 3.8s ease-in-out infinite; }
.pod.p2 .shine::before { animation-delay: 1.2s; } .pod.p3 .shine::before { animation-delay: 2.4s; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pod .shine::before { opacity: .22; } }
:root[data-theme="dark"] .pod .shine::before { opacity: .22; }
.pod .spark { position: absolute; font-size: 15px; line-height: 1; pointer-events: none; animation: twinkle 2.2s ease-in-out infinite; }
.pod .spark.s1 { top: 12px; left: 10px; } .pod .spark.s2 { top: 44px; right: 10px; animation-delay: .55s; font-size: 12px; }
.pod .spark.s3 { bottom: 40px; left: 12px; animation-delay: 1.1s; font-size: 12px; } .pod .spark.s4 { bottom: 14px; right: 14px; animation-delay: 1.65s; }
.pod .crown { position: absolute; top: -24px; font-size: 28px; line-height: 1; animation: bob 2.6s ease-in-out infinite; }
.pod .medal { display: inline-block; font-size: 32px; line-height: 1; transform-origin: 50% 0; animation: swing 2.4s ease-in-out infinite; }
.pod.p2 .medal { animation-delay: .4s; } .pod.p3 .medal { animation-delay: .8s; }
.pod.p1 .medal { font-size: 42px; }
.pod .nm { font-weight: 900; font-size: 13.5px; line-height: 1.3; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pod .pt { font: 900 26px/1 var(--en); letter-spacing: -.03em; } .pod.p1 .pt { font-size: 34px; color: var(--yellow-ink); }
.pod .pt small { font-size: 12px; color: var(--muted); margin-left: 2px; }
.confetti { position: absolute; left: 0; right: 0; top: 0; height: 0; pointer-events: none; z-index: 5; }
.confetti i { position: absolute; top: 8px; width: 8px; height: 12px; border-radius: 2px; opacity: 0; animation: cf 2s cubic-bezier(.2, .7, .4, 1) forwards; }
@keyframes cf { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 25% { opacity: 1; transform: translate(calc(var(--x) * .5), -70px) rotate(calc(var(--r) * .3)); } 100% { opacity: 0; transform: translate(var(--x), 260px) rotate(var(--r)); } }
@keyframes glow { 0%, 100% { box-shadow: 0 6px 0 rgba(247,200,67,.4), 0 0 0 0 rgba(247,200,67,0); } 50% { box-shadow: 0 6px 0 rgba(247,200,67,.4), 0 0 0 9px rgba(247,200,67,.22); } }
@keyframes floaty { 0%, 100% { transform: none; } 50% { transform: translateY(-4px); } }
@keyframes swing { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }
@keyframes sweep { 0% { left: -70%; } 55%, 100% { left: 140%; } }
@keyframes twinkle { 0%, 100% { transform: scale(0) rotate(0); opacity: 0; } 50% { transform: scale(1) rotate(35deg); opacity: 1; } }
@keyframes rise { 0% { transform: translateY(26px) scale(.94); } 70% { transform: translateY(-4px) scale(1.02); } 100% { transform: none; } }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-5px) rotate(6deg); } }
.you { font: 800 10.5px var(--en); letter-spacing: .1em; color: #fff; background: var(--blue); border-radius: 99px; padding: 1px 8px; vertical-align: 2px; }
.rklist { display: grid; gap: 7px; }
.rkrow { display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(60px, 34%) 56px; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 9px 12px; box-shadow: 0 3px 0 var(--line); }
.rkrow.me { border-color: var(--blue); box-shadow: 0 3px 0 var(--blue); background: var(--blue-soft); }
.rkrow .r { width: 28px; height: 28px; border-radius: 9px; background: var(--track); display: grid; place-items: center; font: 800 12px var(--en); color: var(--muted); }
.rkrow .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rkrow .b { height: 9px; border-radius: 99px; background: var(--track); position: relative; }
.rkrow .b i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: linear-gradient(90deg, var(--r3), var(--sky)); }
.rkrow .pt { text-align: right; font: 900 18px var(--en); letter-spacing: -.02em; } .rkrow .pt small { font-size: 11px; color: var(--muted); }
.grp { padding: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.grp div { display: grid; gap: 2px; }
.grp .k { font-size: 12px; color: var(--muted); }
.grp .v { font: 900 28px var(--en); letter-spacing: -.03em; }
.grp .v small { font-size: 12px; color: var(--muted); }
.how { padding: 16px 18px; font-size: 12.5px; color: var(--muted); display: grid; gap: 6px; }
.how b { color: var(--ink); }
.center { min-height: 70vh; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
footer { padding-block: 28px 40px; font-size: 12px; color: var(--muted); }
@media (max-width: 680px) {
  .three { grid-template-columns: 1fr; }
  .ring { width: 96px; height: 96px; }
  .grp { grid-template-columns: 1fr 1fr; }
  .rkrow { grid-template-columns: 28px minmax(0, 1fr) 54px; } .rkrow .b { display: none; }
  .podium { gap: 6px; } .pod { padding-left: 4px; padding-right: 4px; } .pod .pt { font-size: 22px; } .pod.p1 .pt { font-size: 28px; } .pod .medal { font-size: 26px; } .pod.p1 .medal { font-size: 34px; } .pod .chips { display: none; }
  .kv-in { padding: 20px 18px 22px; }
  .orb.g { width: 70px; height: 70px; right: 16px; top: 22px; } .orb.b { width: 40px; height: 40px; right: 92px; top: 86px; } .orb.s { right: 14px; top: 110px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .tilt { transform: none; } .pod .spark, .confetti { display: none; } }
</style>

      podium.appendChild(box); setTimeout(function () { box.remove(); }, 3400);
    }
    if (!('IntersectionObserver' in window)) { run(); return; }
    var io = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { io.disconnect(); run(); } }, { threshold: 0.35 });
    io.observe(podium);
  }

  // ---------- グループの様子 ----------
  function group(t) {
    if (t.phase === '準備中') return '';
    var g = t.g;
    return '<section class="sec"><div class="sec-h"><div><span class="eyebrow">Team</span><h2>' + esc(t.group) + ' のみんな</h2></div><span class="note">' + esc(g.meeting ? '作業会 ' + g.meeting : '') + '</span></div>' +
      '<div class="card grp"><div><span class="k">グループの継続率</span><span class="v">' + (g.cont == null ? '—' : g.cont + '<small>%</small>') + '</span></div>' +
      '<div><span class="k">グループのルール達成率</span><span class="v">' + (g.rule_rate == null ? '—' : g.rule_rate + '<small>%</small>') + '</span></div>' +
      '<div><span class="k">昨日動けた人</span><span class="v">' + g.yday + '<small> / ' + g.n_live + '人</small></span></div></div></section>';
  }
  function how(t) {
    return '<section class="sec"><div class="card how"><b>数え方</b>' +
      '<span><b>継続率</b>：新規DMを1通でも送った日は「継続できた日」。その日数 ÷ 日数（昨日まで）。全体共有リストに書いた行と、部屋の報告に書いた件数の多い方で数えます。夜中0〜5時の報告は前の日に入ります。' + (t.kind === '同期' ? '同期グループは「1日目」と報告した日からの21日間です。' : '') + '</span>' +
      '<span><b>みんなへの貢献</b>：部屋に書いたコメント（返信も含む）と、ほかの人の投稿に押したスタンプの合計。</span>' +
      '<span><b>ルール達成率</b>：グループで決めたルールを守れた日（週のルールは週）の割合の平均。「参考」のルールは平均に入れていません。</span></div></section>';
  }

  function countUp() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    $('#main').querySelectorAll('[data-count]').forEach(function (el) {
      var to = +el.dataset.count; if (!to) return; var t0 = null;
      function step(ts) { if (!t0) t0 = ts; var p = Math.min(1, (ts - t0) / 900); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); }
      requestAnimationFrame(step);
      setTimeout(function () { el.textContent = to; }, 1000);   // 画面が裏にあってアニメが止まっても、本当の数を出す
    });
  }
})();
</script>
